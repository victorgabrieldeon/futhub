apiVersion: v1
kind: Service
metadata:
  name: player
  labels:
    app.kubernetes.io/name: futhub
    app.kubernetes.io/component: player
spec:
  selector:
    app.kubernetes.io/name: futhub
    app.kubernetes.io/component: player
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: player
  labels:
    app.kubernetes.io/name: futhub
    app.kubernetes.io/component: player
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: futhub
      app.kubernetes.io/component: player
  template:
    metadata:
      labels:
        app.kubernetes.io/name: futhub
        app.kubernetes.io/component: player
    spec:
      initContainers:
        - name: wait-api
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - until wget -qO- http://api:3000/health >/dev/null; do sleep 1; done
      containers:
        - name: player
          image: ghcr.io/victorgabrieldeon/futhub-dev
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: [pnpm, --filter, '@futhub/play', dev]
          envFrom:
            - secretRef:
                name: futhub-env
          env:
            - name: PLAYER_API_URL
              value: http://api:3000
          ports:
            - name: http
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
