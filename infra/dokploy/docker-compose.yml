services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: full
    command: >-
      sh -ec 'pnpm --filter @futhub/database db:migrate && exec pnpm --filter @futhub/api start'
    restart: unless-stopped
    environment:
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN}
      API_PORT: ${API_PORT}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      PLAYER_APP_URL: ${PLAYER_APP_URL}
      PLAYER_DISCORD_REDIRECT_URI: ${PLAYER_DISCORD_REDIRECT_URI}
      PLAYER_SESSION_SECRET: ${PLAYER_SESSION_SECRET}
      THESPORTSDB_API_KEY: ${THESPORTSDB_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  admin:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: admin
    command: node server.mjs
    restart: unless-stopped
    environment:
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      ADMIN_API_URL: ${ADMIN_API_URL}
      ADMIN_DISCORD_REDIRECT_URI: ${ADMIN_DISCORD_REDIRECT_URI}
      ADMIN_DISCORD_USER_IDS: ${ADMIN_DISCORD_USER_IDS}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      PORT: ${PORT}
    depends_on:
      api:
        condition: service_started

  player:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: full
    command: pnpm --filter @futhub/play start
    restart: unless-stopped
    environment:
      PLAYER_API_URL: ${PLAYER_API_URL}
      PORT: ${PORT}
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
