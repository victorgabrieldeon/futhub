services:
  api:
    image: futhub-dev
    command: >-
      sh -c 'pnpm --filter @futhub/database db:migrate &&
      pnpm --filter @futhub/api dev'
    volumes:
      - './.env:/app/.env:ro'
    ports:
      - '127.0.0.1::3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s


  admin:
    image: futhub-dev
    command: pnpm --filter @futhub/admin dev --hostname 0.0.0.0 --port 3001
    environment:
      ADMIN_API_URL: http://api:3000
    ports:
      - '127.0.0.1::3001'
  discord-bot:
    image: futhub-dev
    command: pnpm --filter @futhub/discord-bot dev
    volumes:
      - './.env:/app/.env:ro'
    depends_on:
      api:
        condition: service_healthy
